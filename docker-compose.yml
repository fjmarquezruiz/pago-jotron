services:
    db:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: jotron
            MYSQL_USER: jotron
            MYSQL_PASSWORD: jotron_password
            MYSQL_ROOT_PASSWORD: root_password
        ports:
            - '3306:3306'
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-ujotron', '-pjotron_password']
            interval: 5s
            retries: 20
        volumes:
            - db_data:/var/lib/mysql
    # Correo de desarrollo (A10 punto 5): recibe todo lo que envía la tienda, no entrega nada.
    # SMTP en localhost:1025 y bandeja web en http://localhost:8025.
    mailpit:
        image: axllent/mailpit:v1.21
        restart: unless-stopped
        ports:
            - '1025:1025'
            - '8025:8025'
volumes:
    db_data:
